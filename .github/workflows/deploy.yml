name: Build & Deploy

on:
  # Deploy on push to main
  push:
    branches: [main]

  # Allow manual trigger
  workflow_dispatch:

  # Weekly update: every Monday at 06:00 UTC
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write
  pages: write
  id-token: write

# Only one deployment at a time
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # On scheduled runs, fetch fresh data from the source repo
      - name: Update tutorial data from source
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/update-tutorials.mjs

      # If data changed, commit it back so the repo stays in sync
      - name: Commit updated data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/tutorials.ts
          if git diff --cached --quiet; then
            echo "No tutorial data changes detected."
          else
            TUTORIAL_COUNT=$(node -e "import('./src/data/tutorials.ts').catch(()=>{});const d=require('./src/data/tutorials.ts')" 2>/dev/null || echo "")
            git commit -m "chore: update tutorial data from source repository

Automated weekly sync from codecrafters-io/build-your-own-x"
            git push
          fi

      - name: Build Astro site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: update-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
